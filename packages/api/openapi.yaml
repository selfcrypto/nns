# OpenAPI description of the NNS read-only resolver API (@nns/api).
#
# Conventions the whole surface shares:
# - Read-only: every route is GET (HEAD is honoured), there are no writes.
# - Luna amounts are decimal STRINGS (bigint does not survive JSON).
# - Heights are integers.
# - Addresses go out in the conventional spaced form ("NQ34 248H …");
#   inputs are accepted with or without spaces.
# - Every state-derived JSON response carries `height`: the state height of
#   the single database snapshot it was read from.
# - Digests are 0x-prefixed lowercase hex.
# - 503 NOT_SYNCED on every route until the indexer has initialised the
#   database the API reads.
# - Proof documents follow spec §8.3 verbatim (snake_case field names there
#   are the wire format, not this API's style).
# - Open to any origin: every response carries
#   `access-control-allow-origin: *`, OPTIONS answers a preflight, and
#   `x-nns-checkpoint-height` / `x-nns-log-hash` are exposed so a browser can
#   read them. §8.5 asks a client to compare several independent endpoints,
#   which in a browser makes all but one of them a cross-origin fetch.

openapi: 3.1.0
info:
  title: NNS resolver API
  version: 0.2.0
  description: >
    Read-only HTTP over the NNS indexer's database: resolution, availability,
    name detail, ownership listings, offers, parameters, §8.3 Merkle proofs,
    the §8.2 log, checkpoints, settlements and the burn record. No writes, no
    keys, no protocol rules — every rule and every hash comes from @nns/core.

paths:
  /resolve/{name}:
    get:
      summary: Resolve a name to its payment target
      description: >
        Answers only while the name is REGISTERED (§7.3): during GRACE the
        record exists but resolution is off, and the 404 distinguishes the
        two. Dotted queries are refused — §8.6 delegated resolution is the
        client's job. The attached §8.3 proof derives from the latest
        checkpoint, so a name registered since the boundary carries
        `proof: null` until the next one (§8.7 — depth pending, not an
        error); the proof's fields are the checkpoint's record, which may lag
        the live fields beside it.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: The name resolves.
          content:
            application/json:
              schema:
                type: object
                required: [name, target, evm, status, expiry, host, proof, height]
                properties:
                  name: { type: string }
                  target: { $ref: '#/components/schemas/Address' }
                  evm: { $ref: '#/components/schemas/EvmAddress' }
                  status: { const: REGISTERED }
                  expiry: { $ref: '#/components/schemas/Height' }
                  host:
                    type: string
                    description: Delegate resolver host (§6 D), '' when none.
                  proof:
                    oneOf:
                      - $ref: '#/components/schemas/InclusionProof'
                      - type: 'null'
                  height: { $ref: '#/components/schemas/Height' }
        '400':
          description: INVALID_NAME (with the §4.1 reason) or DOTTED_QUERY (with the parent to resolve instead).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND, or IN_GRACE (record exists, resolution off, expiry included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /available/{name}:
    get:
      summary: Whether a name can be registered
      description: >
        Always 200 for a well-formed request — unavailability is an answer,
        with a reason: a §4.1 validity reason, RESERVED (on the published
        list and not released by a fired U), or TAKEN (REGISTERED or GRACE —
        grace names are renewable, hence taken). When available, carries the
        §8.3 non-inclusion proof against the latest checkpoint (§8.5 requires
        checking it before letting a user pay); `null` when no checkpoint
        backs proofs yet or the checkpoint tree still holds the name.
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: Availability verdict.
          content:
            application/json:
              schema:
                type: object
                required: [name, available, height]
                properties:
                  name: { type: string }
                  available: { type: boolean }
                  reason:
                    type: string
                    description: Present iff not available. A §4.1 reason code, RESERVED, or TAKEN.
                  status:
                    type: string
                    description: With reason TAKEN — REGISTERED or GRACE.
                  expiry: { $ref: '#/components/schemas/Height' }
                  proof:
                    oneOf:
                      - $ref: '#/components/schemas/NonInclusionProof'
                      - type: 'null'
                    description: Present iff available.
                  height: { $ref: '#/components/schemas/Height' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /name/{name}:
    get:
      summary: Everything the state knows about one name
      parameters:
        - $ref: '#/components/parameters/name'
      responses:
        '200':
          description: >
            The record (null when unregistered) plus pending items — transfer
            and open offer — and the reserved / unreserved flags. Served
            whenever anything is known, including a bare reserved-list entry.
            The pending object lost its third key, unreserve, in r22: a U
            executes in the block it lands in, so nothing about one is ever
            pending, and the top-level unreserved flag is the whole of what
            this route reports about a U.
          content:
            application/json:
              schema:
                type: object
                required: [name, reserved, unreserved, record, pending, height]
                properties:
                  name: { type: string }
                  reserved:
                    type: boolean
                    description: On the published list and not released by a fired U.
                  unreserved:
                    type: boolean
                    description: A U for this name has fired (release or award). Permanent.
                  record:
                    oneOf:
                      - $ref: '#/components/schemas/NameRecord'
                      - type: 'null'
                  pending:
                    type: object
                    required: [transfer, offer]
                    properties:
                      transfer:
                        oneOf: [{ $ref: '#/components/schemas/PendingTransfer' }, { type: 'null' }]
                      offer:
                        oneOf: [{ $ref: '#/components/schemas/Offer' }, { type: 'null' }]
                  height: { $ref: '#/components/schemas/Height' }
        '400':
          description: INVALID_NAME with the §4.1 reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: NOT_FOUND — nothing known about a valid name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /address/{addr}/names:
    get:
      summary: Names owned by an address
      parameters:
        - name: addr
          in: path
          required: true
          schema: { type: string }
          description: Nimiq address, spaced or compact.
      responses:
        '200':
          description: Owned names (REGISTERED and GRACE), sorted by name. Empty list when none.
          content:
            application/json:
              schema:
                type: object
                required: [address, names, height]
                properties:
                  address: { $ref: '#/components/schemas/Address' }
                  names:
                    type: array
                    items:
                      type: object
                      required: [name, target, evm, expiry, status, host]
                      properties:
                        name: { type: string }
                        target: { $ref: '#/components/schemas/Address' }
                        evm: { $ref: '#/components/schemas/EvmAddress' }
                        expiry: { $ref: '#/components/schemas/Height' }
                        status: { $ref: '#/components/schemas/Status' }
                        host: { type: string }
                  height: { $ref: '#/components/schemas/Height' }
        '400':
          description: INVALID_ADDRESS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /offers:
    get:
      summary: All open offers
      responses:
        '200':
          description: The pending set's open O messages, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [offers, height]
                properties:
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/Offer' }
                  height: { $ref: '#/components/schemas/Height' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /params:
    get:
      summary: The fees in effect, and what a client needs to build fee-bearing messages
      description: >
        The active prices (governable, §10.6), MIN_PRICE — FEE_LONG as in
        effect at this height, computed by core, never a constant (§6 O) —
        the O listing fee, and any scheduled governance change with its
        effective height, so a client sees a fee change coming before it
        bites. A client cannot build a correct G, O or A without this route.
      responses:
        '200':
          description: Current parameters.
          content:
            application/json:
              schema:
                type: object
                required: [prices, minPrice, listingFee, lastGovernanceHeight, pendingGovernance, height]
                properties:
                  prices: { $ref: '#/components/schemas/Prices' }
                  minPrice: { $ref: '#/components/schemas/Luna' }
                  listingFee: { $ref: '#/components/schemas/Luna' }
                  lastGovernanceHeight:
                    oneOf: [{ $ref: '#/components/schemas/Height' }, { type: 'null' }]
                  pendingGovernance:
                    oneOf:
                      - type: object
                        required: [prices, effectiveHeight]
                        properties:
                          prices: { $ref: '#/components/schemas/Prices' }
                          effectiveHeight: { $ref: '#/components/schemas/Height' }
                      - type: 'null'
                  height: { $ref: '#/components/schemas/Height' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /checkpoints/latest:
    get:
      summary: The latest §8.1 checkpoint
      responses:
        '200':
          description: >
            The six committed components and the commitment, 0x-hex, plus the
            layout of the commitment function that produced them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointResponse' }
        '404':
          description: NO_CHECKPOINT — none written yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /checkpoints/{height}:
    get:
      summary: One §8.1 checkpoint by exact height
      description: >
        The same body as /checkpoints/latest, for a named boundary. Two callers
        need it. An anchor publisher must pair the commitment at H with the log
        snapshot through H: it reads /log, takes the height that response
        stamped in x-nns-checkpoint-height, and asks for that exact checkpoint —
        rather than fetch-latest / fetch-log / compare / retry, which loses a
        race at every boundary and can quietly anchor a mismatched pair. And
        §8.5 #2's root half needs it, so two resolvers a checkpoint apart can
        have their roots compared instead of the comparison being skipped.


        Four ways to miss, four statuses, because they are four different
        instructions to the caller: fix the request, wait, ask another server,
        or alert. They deliberately do not collapse into one 404.
      parameters:
        - name: height
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
          description: >
            An absolute multiple of CHECKPOINT_INTERVAL (720). Not an offset
            from LAUNCH_HEIGHT (§8.1).
      responses:
        '200':
          description: The checkpoint at that height. Identical in shape to /checkpoints/latest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointResponse' }
        '400':
          description: >
            INVALID_HEIGHT — not a decimal integer, or out of range.
            NOT_A_CHECKPOINT_HEIGHT — a well-formed height that is not an
            absolute multiple of CHECKPOINT_INTERVAL. A client error rather
            than a 404 of a real thing: no checkpoint can ever exist off a
            boundary, so retrying will never succeed. Carries `interval` and
            `nearest: {below, above}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >
            CHECKPOINT_PENDING — a boundary the indexer has not reached yet;
            carries `latest` so the caller can compute the wait instead of
            polling blind. CHECKPOINT_MISSING — a boundary inside the retained
            range with no row, which should never happen and means this
            database has a gap; a 404 because retrying will not help, but named
            separately so it can be alerted on. NO_CHECKPOINT — the database
            holds none at all.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: >
            CHECKPOINT_NOT_RETAINED — a boundary older than the oldest this
            server holds; carries `oldest`. Gone rather than Not Found: the
            resource is real and this server does not have it, so the caller
            should ask a server with deeper retention. Phrased "not retained"
            because the API cannot distinguish a pruned checkpoint from one
            below this database's LAUNCH_HEIGHT, and should not guess.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /log:
    get:
      summary: The §8.2 log through the latest checkpoint
      description: >
        The exact canonical file bytes whose keccak256 IS the checkpoint's
        committed log hash — verifiable, not merely informative. Lines above
        the checkpoint are excluded until the next boundary covers them.
      responses:
        '200':
          description: The canonical log file.
          headers:
            x-nns-checkpoint-height:
              schema: { type: integer }
              description: The checkpoint height the served prefix is covered through.
            x-nns-log-hash:
              schema: { type: string }
              description: The committed keccak256 of exactly this body, 0x-hex.
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: NO_CHECKPOINT — none written yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /log/decoded:
    get:
      summary: The §8.2 log with its data field rendered as text
      description: >
        A reading aid, NOT the artifact. §8.2 makes `data` lowercase hex so a
        malformed but NNS1-prefixed payload cannot forge a log line by carrying
        a space or a newline; the cost is that every legitimate line is
        unreadable. This serves the same lines decoded, while GET /log keeps
        serving the bytes the checkpoint commits to.


        Deliberately JSON rather than text, and deliberately without the
        x-nns-log-hash header, so it cannot be mistaken for the canonical file
        or hashed by accident. Each entry carries `data` unchanged beside
        `message`, so a reader can verify the rendering rather than trust it.


        `message` renders bytes outside printable ASCII as %xx, and % itself as
        %25. `type` is the §6 message letter, or null when the payload does not
        parse — in which case `parseFailure` names the §5.2 reason.


        `?format=text` serves the same lines as an aligned table for reading in
        a browser. It opens with `#` comment lines naming /log and its
        keccak256: no §8.2 line can begin with `#` — every one begins with a
        decimal height — so the text view cannot be parsed as a log or hashed
        into a match, which matters because /log is text/plain as well.
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, text], default: json }
          description: >
            json (default) for machines, text for an aligned human-readable
            table. Any other value is a 400 UNKNOWN_FORMAT rather than a silent
            fallback to json.
      responses:
        '200':
          description: >
            The log through the latest checkpoint, decoded. JSON by default;
            text/plain when format=text.
          content:
            text/plain:
              schema:
                type: string
                description: Aligned table, preceded by # comment lines naming the canonical artifact.
            application/json:
              schema:
                type: object
                required: [canonical, entries, height]
                properties:
                  canonical:
                    type: object
                    description: Where the artifact this is derived from lives.
                    required: [path, checkpointHeight, logHash, note]
                    properties:
                      path: { type: string }
                      checkpointHeight: { type: integer }
                      logHash: { type: string }
                      note: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required:
                        [blockHeight, txIndex, txHash, sender, recipient, value, verdict, data, message, type, parseFailure]
                      properties:
                        blockHeight: { type: integer }
                        txIndex: { type: integer }
                        txHash: { type: string }
                        sender: { type: string }
                        recipient: { type: string }
                        value: { type: string, description: Luna, decimal string. }
                        verdict: { type: string }
                        data: { type: string, description: The canonical §8.2 hex, unchanged. }
                        message: { type: string, nullable: true, description: Decoded payload; %xx for non-printable bytes. }
                        type: { type: string, nullable: true, description: §6 message letter, or null when unparseable. }
                        parseFailure: { type: string, nullable: true }
                  height: { type: integer }
        '404':
          description: NO_CHECKPOINT — none written yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /settlements:
    get:
      summary: Outstanding settlement obligations
      description: >
        What an M has yet to discharge (§6 M, §7.4): refunds, sale proceeds
        and commission, keyed by the transaction that created the debt.
        Deliberately not part of the §8.1 commitment — settled-versus-owed is
        computable from the log; this is the convenience view.
      parameters:
        - name: owed_to
          in: query
          required: false
          schema: { type: string }
          description: Filter by creditor address.
      responses:
        '200':
          description: Outstanding obligations in canonical order.
          content:
            application/json:
              schema:
                type: object
                required: [outstanding, height]
                properties:
                  outstanding:
                    type: array
                    items:
                      type: object
                      required: [ref, ordinal, kind, owedBy, owedTo, amount]
                      properties:
                        ref:
                          type: object
                          required: [height, txIndex]
                          properties:
                            height: { $ref: '#/components/schemas/Height' }
                            txIndex: { type: integer }
                        ordinal: { type: integer }
                        kind:
                          type: string
                          enum: [REFUND, SALE_PROCEEDS, COMMISSION]
                        owedBy: { $ref: '#/components/schemas/Address' }
                        owedTo: { $ref: '#/components/schemas/Address' }
                        amount: { $ref: '#/components/schemas/Luna' }
                  height: { $ref: '#/components/schemas/Height' }
        '400':
          description: INVALID_ADDRESS in owed_to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /burn:
    get:
      summary: The burn record — both halves of §10.2 (revised 2026-08-17)
      description: >
        Every log line addressed to BURN_ADDRESS — F attestations and
        anything that forfeited trying — with the accepted total, the
        treasury's accepted revenue, and the owed figure BURN_SHARE derives
        from it. Only tagged transfers enter the log, which is the point of
        F: an untagged burn is exactly the shortfall this record makes
        visible. Until 2026-08-17 this route served only the burned half and
        deferred "owed" to a dashboard that did not exist, which left
        §10.2's burned-versus-owed identity computable by nobody; both
        halves now come from one snapshot. The revenue base is §10.2's
        normative definition since r24 — OK-verdict G/N/O fees plus M
        commission reaching the treasury; forfeited inflows and stray dust
        are outside it, and the base is defined over the log rather than the
        balance, which also holds dust, refund money in flight, and
        wrongly-sent amounts.
      responses:
        '200':
          description: Attestations in canonical order, and the §10.2 sums.
          content:
            application/json:
              schema:
                type: object
                required: [revenue, owed, burned, attestations, height]
                properties:
                  revenue:
                    $ref: '#/components/schemas/Luna'
                    description: >
                      Accepted revenue reaching TREASURY_ADDRESS: OK-verdict
                      G, N, O and M lines with the treasury as recipient.
                  owed:
                    $ref: '#/components/schemas/Luna'
                    description: >
                      BURN_SHARE (20%) of revenue, floored to whole luna.
                  burned:
                    $ref: '#/components/schemas/Luna'
                    description: Sum of value over lines whose verdict is OK.
                  attestations:
                    type: array
                    items:
                      type: object
                      required: [height, txIndex, txHash, sender, value, verdict]
                      properties:
                        height: { $ref: '#/components/schemas/Height' }
                        txIndex: { type: integer }
                        txHash: { type: string }
                        sender: { $ref: '#/components/schemas/Address' }
                        value: { $ref: '#/components/schemas/Luna' }
                        verdict: { type: string }
                  height: { $ref: '#/components/schemas/Height' }
        '503': { $ref: '#/components/responses/NotSynced' }

  /openapi.yaml:
    get:
      summary: This document
      description: >
        The API's own contract, served so an integrator can generate a client
        without cloning the repository. REST has no discovery mechanism of its
        own — unlike GraphQL introspection, and OPTIONS reports methods rather
        than paths — so publishing this is what makes the surface
        machine-readable. §8.5 asks clients to query several independent
        resolvers, so every operator serves the same contract at the same
        path.

        The one route with no `503`: it is static, needs no database snapshot,
        and is true whether or not the indexer has written state yet. An
        integrator reading the contract during a backfill should not be told
        the service is down.

        `routes.test.ts` compares the `paths` here against the server's route
        table and fails on any difference, so this document cannot quietly
        stop matching the server it describes.
      responses:
        '200':
          description: This OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

components:
  parameters:
    name:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: A §4.1 name. Lowercase; the API rejects rather than normalises.

  responses:
    NotSynced:
      description: The indexer has not initialised this database yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Address:
      type: string
      description: Nimiq address in conventional spaced form.
      examples: ['NQ34 248H 248H 248H 248H 248H 248H 248H 248H']
    EvmAddress:
      type: string
      pattern: '^(0x[0-9a-f]{40})?$'
      description: >
        §6 E record — the EVM address the owner declared, lowercase 0x-hex,
        '' when unset. One record covers every EVM chain.
    Luna:
      type: string
      pattern: '^[0-9]+$'
      description: Integer luna as a decimal string. 1 NIM = 100,000 luna.
    Height:
      type: integer
      description: Nimiq block height.
    Digest:
      type: string
      pattern: '^0x[0-9a-f]{64}$'
    Status:
      type: string
      enum: [REGISTERED, GRACE]
    Checkpoint:
      type: object
      required: [height, layout, nameRoot, pricesRoot, pendingRoot, unreservedRoot, logHash, commitment]
      properties:
        height: { $ref: '#/components/schemas/Height' }
        layout: { type: integer }
        nameRoot: { $ref: '#/components/schemas/Digest' }
        pricesRoot: { $ref: '#/components/schemas/Digest' }
        pendingRoot: { $ref: '#/components/schemas/Digest' }
        unreservedRoot:
          oneOf: [{ $ref: '#/components/schemas/Digest' }, { type: 'null' }]
          description: null on a layout-1 row, whose commitment function had no such digest.
        logHash: { $ref: '#/components/schemas/Digest' }
        commitment:
          allOf: [{ $ref: '#/components/schemas/Digest' }]
          description: >
            The §8.1 checkpoint commitment — the six-component digest, and what
            §9 anchors. Not nameRoot: an inclusion proof verifies against
            nameRoot, which is one component of this value (§8.5 #3).
    CheckpointResponse:
      type: object
      description: Shared by /checkpoints/latest and /checkpoints/{height}, so a client verifies either with the same code.
      required: [checkpoint, height]
      properties:
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        height: { $ref: '#/components/schemas/Height' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable machine-readable code (NOT_FOUND, IN_GRACE, INVALID_NAME, DOTTED_QUERY, INVALID_ADDRESS, INVALID_HEIGHT, NOT_A_CHECKPOINT_HEIGHT, CHECKPOINT_PENDING, CHECKPOINT_NOT_RETAINED, CHECKPOINT_MISSING, UNKNOWN_ROUTE, METHOD_NOT_ALLOWED, NO_CHECKPOINT, NOT_SYNCED, INTERNAL).
      additionalProperties: true
    NameRecord:
      type: object
      required: [name, owner, target, evm, expiry, status, host]
      properties:
        name: { type: string }
        owner: { $ref: '#/components/schemas/Address' }
        target: { $ref: '#/components/schemas/Address' }
        evm: { $ref: '#/components/schemas/EvmAddress' }
        expiry: { $ref: '#/components/schemas/Height' }
        status: { $ref: '#/components/schemas/Status' }
        host: { type: string }
    PendingTransfer:
      type: object
      required: [newOwner, effectiveHeight]
      properties:
        newOwner: { $ref: '#/components/schemas/Address' }
        effectiveHeight: { $ref: '#/components/schemas/Height' }
    Offer:
      type: object
      required: [name, seller, price, openedHeight, expiryHeight]
      properties:
        name: { type: string }
        seller: { $ref: '#/components/schemas/Address' }
        price: { $ref: '#/components/schemas/Luna' }
        openedHeight: { $ref: '#/components/schemas/Height' }
        expiryHeight: { $ref: '#/components/schemas/Height' }
    Prices:
      type: object
      required: [feeStandard, feeLong, commissionBp]
      properties:
        feeStandard: { $ref: '#/components/schemas/Luna' }
        feeLong: { $ref: '#/components/schemas/Luna' }
        commissionBp:
          type: string
          description: Basis points, decimal string.
    ProofStep:
      type: object
      required: [hash, side]
      properties:
        hash: { $ref: '#/components/schemas/Digest' }
        side:
          type: string
          enum: [left, right]
          description: Which side the SIBLING sits on (§8.3).
    ProvenLeaf:
      type: object
      description: >
        One §8.1 leaf with its path. Carries every field the leaf encodes —
        delegate and evm included, '' when unset — because the verifier
        re-derives the leaf hash from these fields; omit one and the proof
        binds nothing (§8.3).
      required: [name, owner, target, evm, expiry, status, delegate, leaf_index, proof]
      properties:
        name: { type: string }
        owner: { $ref: '#/components/schemas/Address' }
        target: { $ref: '#/components/schemas/Address' }
        evm: { $ref: '#/components/schemas/EvmAddress' }
        expiry: { $ref: '#/components/schemas/Height' }
        status: { $ref: '#/components/schemas/Status' }
        delegate:
          type: string
          description: Delegate resolver host, '' when none. §8.3's name for the record's host field.
        leaf_index: { type: integer }
        proof:
          type: array
          items: { $ref: '#/components/schemas/ProofStep' }
    InclusionProof:
      description: The §8.3 inclusion document. anchor is null until the Ethereum anchor publishes (§9).
      allOf:
        - $ref: '#/components/schemas/ProvenLeaf'
        - type: object
          required: [root, nimiq_height, anchor]
          properties:
            root: { $ref: '#/components/schemas/Digest' }
            nimiq_height:
              $ref: '#/components/schemas/Height'
              description: The checkpoint height the proof is against.
            anchor:
              oneOf:
                - type: object
                  properties:
                    chain: { type: string }
                    tx: { type: string }
                    block: { type: integer }
                - type: 'null'
    NonInclusionProof:
      type: object
      description: >
        §8.3 non-inclusion — the two leaves that lexicographically bracket
        the queried name, each with its own proof; a single boundary leaf at
        the tree's edges; both null on an empty tree, whose all-zero root is
        itself the proof. Proves AVAILABLE, since grace names are in the
        tree (§8.1).
      required: [kind, previous, next, root, nimiq_height, anchor]
      properties:
        kind:
          type: string
          enum: [EMPTY_TREE, BEFORE_FIRST, AFTER_LAST, BETWEEN]
        previous:
          oneOf: [{ $ref: '#/components/schemas/ProvenLeaf' }, { type: 'null' }]
        next:
          oneOf: [{ $ref: '#/components/schemas/ProvenLeaf' }, { type: 'null' }]
        root: { $ref: '#/components/schemas/Digest' }
        nimiq_height: { $ref: '#/components/schemas/Height' }
        anchor:
          oneOf: [{ type: object }, { type: 'null' }]
