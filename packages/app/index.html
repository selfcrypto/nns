<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" />
    <!-- Brand, then what it is, split on a pipe: the em dash read as a
         sentence trailing off, and a lowercase fragment after it read as a
         subtitle to a subtitle. "Name resolution service" is also nearly the
         protocol's own name — NNS is the Nimiq Name Service — so the words
         someone searches for are the words that are true. -->
    <title>Nimiq Names | Your Nimiq name resolution service</title>
    <meta name="description" content="One name instead of an address. Register and manage your name on Nimiq — on-chain, self-custody, no smart contracts." />

    <!-- The mark alone, not the NNS lockup: the site is Nimiq Names, NNS is the
         protocol it speaks. Apple composites its icon on black, so that one is
         flattened.

         `/favicon.ico` is here for the fetchers that never read this file.
         Nimiq Pay's app list draws its icon from Google's favicon service
         (`t2.gstatic.com/faviconV2`, `nimpay-website`'s `getFaviconUrl`), which
         answered 404 for this origin and left the app under a globe while every
         neighbour in the list had a mark. Declared as well as served, so a
         reader of the head and a reader of the root agree. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- The social card. A link preview crawler is not a browser: Telegram,
         WhatsApp and Slack drop a relative og:image instead of resolving it
         against the page they just fetched, so these are the only absolute
         URLs in a bundle that is otherwise `base: './'`. Serving it from
         another host? NNS_SITE_URL rewrites them — plugins/social.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nimiq Names" />
    <meta property="og:url" content="https://nimiqnames.com/" />
    <meta property="og:title" content="Nimiq Names | Your Nimiq name resolution service" />
    <meta property="og:description" content="One name instead of an address. Register and manage your name on Nimiq — on-chain, self-custody, no smart contracts." />
    <meta property="og:image" content="https://nimiqnames.com/brand/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nimiq Names — the mark and the name" />

    <!-- Twitter falls back to the og: tags for everything but the card shape.
         WhatsApp does not read these at all; Telegram reads whichever it
         finds first, so the two descriptions say the same thing. -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
