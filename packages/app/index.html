<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f6" />
    <title>Nimiq Names</title>
    <meta name="description" content="One name instead of an address. Register and manage your name on Nimiq — on-chain, self-custody, no smart contracts." />

    <!-- The mark alone, not the NNS lockup: the site is Nimiq Names, NNS is the
         protocol it speaks. The lockup is the social card, where the protocol's
         name belongs. Apple composites its icon on black, so that one is flattened. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Relative, like every other URL this bundle ships: one image runs on any
         hostname, and a crawler resolves it against the page it just fetched. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nimiq Names" />
    <meta property="og:title" content="Nimiq Names — your name on Nimiq" />
    <meta property="og:description" content="One name instead of an address. On-chain, self-custody, no smart contracts." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
