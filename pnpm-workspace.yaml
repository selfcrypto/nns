packages:
  - 'packages/*'

# All three arrive transitively with @nimiq/hub-api and are refused their
# postinstall scripts: bufferutil and utf-8-validate are optional native
# accelerators for ws (a browser bundle never loads them), and es5-ext's
# script only prints a banner. Nothing here runs code at install time.
allowBuilds:
  bufferutil: false
  es5-ext: false
  utf-8-validate: false

# One version per dependency across all eight packages. Referenced as
# "catalog:" in each package.json, so they cannot drift apart.
catalog:
  # The mini app's whole dependency list, deliberately short (§2.2: every
  # dependency is supply-chain surface in an app whose product is "trust
  # this address"). No router, no data-fetching library, no state manager.
  '@nimiq/hub-api': ^1.14.0
  '@nimiq/identicons': ^1.6.2
  '@nimiq/mini-app-sdk': ^0.1.0
  '@noble/curves': ^2.3.0
  '@noble/hashes': ^2.3.0
  '@types/node': ^26.2.0
  '@types/pg': ^8.21.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.0.0
  '@vitest/coverage-v8': ^4.1.10
  # Build-time only, and the one dependency the docs section is allowed
  # (packages/app/CLAUDE.md): it turns the Markdown under packages/app/docs
  # into HTML during `vite build` and never reaches the bundle, the same
  # relationship solc has to the anchor contract. Zero dependencies of its own.
  marked: ^18.0.12
  pg: ^8.23.0
  react: ^19.2.0
  react-dom: ^19.2.0
  vite: ^8.2.0
  # Exact, no caret, and deliberately so: solc version is an input to the
  # bytecode. A floating range would let `pnpm install` change the deployed
  # contract's CREATE2 address on somebody else's machine, which is the one
  # thing packages/anchor's committed artifact exists to make impossible.
  solc: 0.8.30
  typescript: ^7.0.2
  # EVM transaction signing only — see packages/anchor/src/viem-rpc.ts. Reads
  # go through plain JSON-RPC over fetch; what is not worth hand-rolling under
  # a real deploy key is secp256k1 + RLP + the EIP-1559 envelope.
  viem: ^2.55.15
  vitest: ^4.1.10

minimumReleaseAgeExclude:
  - viem@2.55.15
