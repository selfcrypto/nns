# Overlay: serve an uptime monitor's public status page through the edge.
#
# Opt in from .env:
#
#   COMPOSE_FILE=docker-compose.yml:status.yml
#   NNS_EDGE_STATUS_HOST=status.example.com
#
# An overlay, not an edit: the base file stays complete on
# its own, and the extra hostname is required only once you have asked for it.
# The vhost proxies only the status page's anonymous paths to 127.0.0.1:3001;
# Kuma's dashboard and login remain loopback-only (SSH tunnel).

services:
  edge:
    environment:
      NNS_EDGE_STATUS_HOST: ${NNS_EDGE_STATUS_HOST:?set your status hostname in .env, or drop status.yml from COMPOSE_FILE}
      # Must match the slug the monitor is configured with — it is where
      # a request for / is redirected.
      NNS_EDGE_STATUS_SLUG: ${NNS_EDGE_STATUS_SLUG:-services}
    volumes:
      - ./vhost-status.conf.template:/etc/nginx/templates/vhost-status.conf.template:ro
